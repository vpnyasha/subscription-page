<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="color-scheme" content="light only" />
        <!-- Safari 26 этот тег игнорирует (бары тинтятся по CSS, см. global.css),
             но в iOS 18 и Chrome на Android он всё ещё красит строку браузера -->
        <meta name="theme-color" content="#E5DACF" />

        <!-- Полноэкранный режим, когда страницу добавили на домашний экран:
             в обычном браузере статус-бар iOS скрыть нельзя -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <!-- viewport-fit=cover намеренно НЕ задан. С ним страница заезжает под
             статус-бар, и Safari 26 при скролле начинает размывать проезжающий
             контент — бар белел на ходу. Без него страница начинается под
             баром, размывать нечего, и бар держит цвет .animated-background.
             Плата: env(safe-area-inset-*) становятся нулевыми. -->
        <meta
            name="viewport"
            content="minimum-scale=1, initial-scale=1, width=device-width, user-scalable=no"
        />
        <!-- Иконки лежат в корне, а НЕ в /assets: этот префикс бэкенд закрывает
             кукой session (check-assets-cookie.middleware.ts) и без неё рвёт
             соединение, а кука живёт 30 минут. Safari качает иконки отдельно от
             страницы, часто позже — обрыв, и во вкладке остаётся старая. -->
        <link rel="icon" sizes="32x32" href="/favicon.ico" />
        <!-- SVG читают Chrome и Firefox; Safari (macOS и iOS) их не понимает
             вообще и берёт .ico выше — поэтому он обязателен.
             Сам SVG на CDN, как и логотип: меняется без пересборки образа -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="https://ru5p7eussw.cdn.twcstorage.ru/flower.svg"
        />
        <!-- Домашний экран iOS: 180×180 и обязательно без прозрачности,
             иначе Safari подложит под цветок чёрный фон -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.googleapis.com" />
        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.gstatic.com" />

        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap"
            rel="stylesheet"
        />

        <meta name="description" content="<%- metaDescription %>" />
        <title><%- metaTitle %></title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>

        <div id="sbpg" data-panel="<%- panelData %>"></div>
    </body>
</html>
