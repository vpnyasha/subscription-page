name: Build and push

on:
  push:
    tags:
      - '*'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run start:build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  build-docker-images:
    name: Build ${{ matrix.platform }}
    needs: [build-frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # GHCR принимает только нижний регистр, а владелец репозитория может
      # содержать заглавные буквы.
      - name: Resolve image name
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifests
    needs: [build-docker-images]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image name
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_ENV"

      # Сборка по тегу выкладывается как latest + версия, ручной запуск из ветки
      # получает тег по имени ветки, чтобы не перетирать релизный latest.
      - name: Resolve tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAGS=-t ${{ env.IMAGE }}:latest -t ${{ env.IMAGE }}:${{ github.ref_name }}" \
              >> "$GITHUB_ENV"
            echo "INSPECT_TAG=${{ env.IMAGE }}:${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            ref_name="${{ github.ref_name }}"
            branch_tag="${ref_name//\//-}"
            echo "TAGS=-t ${{ env.IMAGE }}:${branch_tag}" >> "$GITHUB_ENV"
            echo "INSPECT_TAG=${{ env.IMAGE }}:${branch_tag}" >> "$GITHUB_ENV"
          fi

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ env.TAGS }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.INSPECT_TAG }}
