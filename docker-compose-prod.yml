services:
  remnawave-subscription-page:
    # Образ форка из GHCR. Путь должен совпадать с owner/repo на GitHub
    # в нижнем регистре — именно так его публикует .github/workflows/build-and-push.yml
    image: ghcr.io/vpnyasha/subscription-page:latest
    container_name: remnawave-subscription-page
    hostname: remnawave-subscription-page
    restart: always
    env_file:
      - .env
    ports:
      - '127.0.0.1:3010:3010'
    networks:
      - remnawave-network

networks:
  remnawave-network:
    driver: bridge
    external: true
